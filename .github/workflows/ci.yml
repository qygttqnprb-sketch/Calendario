name: Verify MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_database.py
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/live_acceptance.sql
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash scripts/setup_ios.sh
      - name: Build and test on an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if "iPhone" in v["name"]))')
          xcodebuild test -project ios/Coppia.xcodeproj -scheme Coppia -resultBundlePath ios/TestResults.xcresult -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
      - name: Record resolved package versions
        if: always()
        run: |
          LOCK=ios/Coppia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$LOCK" ]; then
            echo COPPIA_PACKAGE_RESOLVED_BEGIN
            cat "$LOCK"
            echo COPPIA_PACKAGE_RESOLVED_END
          fi
      - name: Upload simulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
  api-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Configure disposable local Auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/config.toml')
          p.write_text(p.read_text().replace('enable_confirmations = true','enable_confirmations = false'))
          PY
      - name: Start local Supabase and apply all migrations
        run: |
          supabase --help > /dev/null
          supabase start --help > /dev/null
          supabase start > /tmp/coppia-start.log 2>&1
          supabase status --help > /dev/null
          supabase status -o json > /tmp/coppia-local-status.json
      - name: Verify Auth, Data API, privacy and Realtime with three users
        run: node tests/api-realtime.mjs /tmp/coppia-local-status.json
      - name: Stop disposable stack
        if: always()
        run: supabase stop
