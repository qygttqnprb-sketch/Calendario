name: Coppia
options:
  bundleIdPrefix: it.coppia
  deploymentTarget:
    iOS: '17.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.30.0
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_SUPABASE_URL: $(SUPABASE_URL)
    INFOPLIST_KEY_SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Esporta i tuoi eventi nel Calendario Apple solo con il tuo consenso.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Coppia
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  Coppia:
    type: application
    platform: iOS
    sources: [Coppia]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.coppia.calendario
  CoppiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CoppiaTests]
    dependencies:
      - target: Coppia
schemes:
  Coppia:
    build:
      targets:
        Coppia: all
        CoppiaTests: [test]
    test:
      targets: [CoppiaTests]
